; Fujitsu ASTG34KMTC WiFi-dongle firmware — ESP32-C3 build for the nathansags board
;
; Uses the pioarduino platform fork because the FujitsuAC library requires
; Arduino-ESP32 core 3.x (NetworkClient.h, ledcAttach, ...) which the official
; platformio espressif32 platform (pinned at core 2.x) does not provide.
;
; FujitsuAC is pinned to the exact upstream commit that was audited
; (v1.3.16, 2026-06-19). Bump deliberately, re-checking the C3 pin block in
; examples/Controller/Controller.ino when you do.

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Mac note from upstream README: flashing at higher rates fails on macOS
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient@^2.8
    https://github.com/Benas09/FujitsuAC.git#0f3c2d59a749e0de463f7ec20b1a9fcfa2367a51
