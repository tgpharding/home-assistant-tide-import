; Fujitsu ASTG34KMTC WiFi-dongle firmware — ESP32-C3 build for the nathansags board
;
; Uses the pioarduino platform fork because the FujitsuAC library requires
; Arduino-ESP32 core 3.x (NetworkClient.h, ledcAttach, ...) which the official
; platformio espressif32 platform (pinned at core 2.x) does not provide.
;
; FujitsuAC is pinned to the exact upstream commit that was audited
; (v1.3.16, 2026-06-19). Bump deliberately, re-checking the C3 pin block in
; examples/Controller/Controller.ino when you do.

[env:esp32-c3-devkitm-1]
; Arduino core 3.0.7 / IDF 5.1 — deliberately NOT the newest pioarduino
; release. On 54.03.20 (core 3.2.0 / IDF 5.4) the C3's UART RX delivery
; interrupts (timeout + FIFO threshold) never fire on either UART: frames
; land byte-perfect in the RX FIFO but are only surfaced by a break-forced
; flush. Bench-verified with a clean driver reinstall, explicit thresholds,
; and power management disabled. Core 3.0.x matches the era upstream's
; working dongles are built against.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Mac note from upstream README: flashing at higher rates fails on macOS
upload_speed = 460800
lib_deps =
    knolleary/PubSubClient@^2.8
    https://github.com/Benas09/FujitsuAC.git#0f3c2d59a749e0de463f7ec20b1a9fcfa2367a51
build_src_filter = +<*> -<pintest/>
; Route the serial console to native USB. Critical on this board: the C3's
; default UART0 console pins ARE GPIO20/21 (CN1), and a UART0-based console
; steals them back from the AC UART during setup (bench-verified).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Contingency build for an inverting CN1 level shifter (see README "polarity"
; section). Identical except the library's UART line inversion is patched out,
; letting the shifter provide the inversion instead. Flash with:
;   pio run -e esp32-c3-noinvert -t upload
; On this build, never press "Update firmware" in HA — the network update
; would reinstall upstream's inverted-UART binary.
[env:esp32-c3-noinvert]
extends = env:esp32-c3-devkitm-1
extra_scripts = pre:patch_noinvert.py
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -DFUJITSU_NO_LINE_INVERSE

; Bench diagnostic: slow square wave on GPIO21, reads GPIO20, reports over
; native-USB serial (the only build with a serial console). Verifies the CN1
; pin mapping and level-shifter polarity with a multimeter + jumper wire.
;   pio run -e pintest -t upload && pio device monitor
[env:pintest]
extends = env:esp32-c3-devkitm-1
build_src_filter = -<*> +<pintest/>

; Bare-metal UART RX diagnostic: no FujitsuAC lib, no WiFi. Same UART config
; as the AC firmware; prints FIFO depth, ring depth, and raw interrupt
; status/enable registers over the USB console.
;   pio run -e uarttest -t upload && pio device monitor
[env:uarttest]
extends = env:esp32-c3-devkitm-1
build_src_filter = -<*> +<uarttest/>
